# application.yml

spring:
  application:
    name: mmaug-claims-agent-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mmaug_claims}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: MMAUGClaimsPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 300MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    disable-swagger-default-url: true
  show-actuator: false
  packages-to-scan: com.mmaug.claimsagent

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
    audience: ${ENTRA_AUDIENCE:api://mmaug-claims-api}
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:3000
        - http://localhost:8080
    rate-limit:
      upload-per-minute: 10
      analyse-per-minute: 5
  storage:
    account-name: ${STORAGE_ACCOUNT_NAME:}
    account-key: ${STORAGE_ACCOUNT_KEY:}
    quarantine-container: ${STORAGE_QUARANTINE_CONTAINER:quarantine}
    clean-container: ${STORAGE_CLEAN_CONTAINER:clean}
    max-file-size-mb: 15
    allowed-types:
      - pdf
      - jpg
      - jpeg
      - png
      - tiff
    max-files-per-claim: 20
    base-path: ${STORAGE_PATH:./storage}
  ai:
    summary-provider: ${AI_SUMMARY_PROVIDER:deterministic}
    key: ${AI_KEY:}
    endpoint: ${AI_ENDPOINT:}
    deployment: ${AI_DEPLOYMENT:}
    temperature: 0.0
    max-tokens: 2000
    timeout-seconds: 60
    prompt-version: v1
    tool-schema-version: v1
    max-tool-iterations: 6
  docintel:
    provider: ${DOCINTEL_PROVIDER:stub}
    key: ${DOCINTEL_KEY:}
    endpoint: ${DOCINTEL_ENDPOINT:}
    model: prebuilt-layout
  tools:
    base-url: ${TOOLS_BASE_URL:http://localhost:8080/internal/tools/v1}
    timeout-ms: 10000
    retries: 2
  rules:
    path: classpath:rules/business-rules.yaml
  retention:
    document-days: 2555
    audit-days: 3650
    summary-days: 2555
  logging:
    mask-pii: true

logging:
  level:
    root: INFO
    com.mmaug.claimsagent: INFO
    org.springframework.security: INFO

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 300MB
