spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///mmaug_claims_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
    hikari:
      minimum-idle: 0
      maximum-pool-size: 2
  jpa:
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  ai:
    prompt-version: v1
    tool-schema-version: v1
    max-tool-iterations: 6
  docintel:
    model: prebuilt-layout
  tools:
    base-url: http://localhost:8080/internal/tools/v1
    timeout-ms: 10000
    retries: 2
  rules:
    path: classpath:rules/business-rules.yaml
  retention:
    document-days: 2555
    audit-days: 3650
    summary-days: 2555
  logging:
    mask-pii: true

logging:
  level:
    root: WARN
    com.mmaug.claimsagent: INFO
