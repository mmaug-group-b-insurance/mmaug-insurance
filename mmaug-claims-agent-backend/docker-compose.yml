services:
  postgres:
    image: postgres:16-alpine
    container_name: mmaug-postgres
    environment:
      POSTGRES_DB: mmaug_claims
      POSTGRES_USER: mmaug
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting Compose}
    ports:
      - "5432:5432"
    volumes:
      - mmaug-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmaug -d mmaug_claims"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mmaug-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/mmaug_claims
      DB_USERNAME: kingz1127
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting Compose}
      ENTRA_ISSUER_URI: ${ENTRA_ISSUER_URI:-}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:-api://mmaug-claims-api}
      STORAGE_PATH: /app/storage
      LOG_DIR: /app/logs
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-change-me-to-a-32-byte-secret-value}
      APP_VERSION: ${APP_VERSION:-1.0.0-SNAPSHOT}
      PROMPT_VERSION: ${PROMPT_VERSION:-v1}
      TOOL_VERSION: ${TOOL_VERSION:-v1}
      RULES_VERSION: ${RULES_VERSION:-1.0.0}
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - mmaug-storage:/app/storage
      - mmaug-logs:/app/logs

volumes:
  mmaug-pgdata:
  mmaug-storage:
  mmaug-logs: