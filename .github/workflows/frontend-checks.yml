name: Frontend checks
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-checks.yml']
  push:
    branches: [main, develop]
    paths: ['frontend/**', '.github/workflows/frontend-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked dependency tree without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Audit runtime and development dependencies
        run: npm audit --json > npm-audit.json
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run component and validation tests
        run: npm test -- --reporter=junit --outputFile=test-results.xml
      - name: Build the production frontend
        run: npm run build
      - name: Record dependency lock checksum
        run: sha256sum package-lock.json > dependency-lock-sha256.txt
      - name: Retain dependency and test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-verification-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            frontend/npm-audit.json
            frontend/test-results.xml
            frontend/dependency-lock-sha256.txt
