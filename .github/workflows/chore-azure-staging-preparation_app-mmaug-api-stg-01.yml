name: Build and deploy Java backend to Azure - app-mmaug-api-stg-01

on:
  push:
    branches: [main, chore/azure-staging-preparation]
    paths:
      - 'mmaug-claims-agent-backend/**'
      - '.github/workflows/chore-azure-staging-preparation_app-mmaug-api-stg-01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MMAUG_RUN_LIVE_OCR: 'false'
      MMAUG_RUN_LIVE_MODEL: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: mmaug-claims-agent-backend/pom.xml
      - name: Test and package the Java backend with isolated PostgreSQL
        working-directory: mmaug-claims-agent-backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-jar
          path: mmaug-claims-agent-backend/target/mmaug-claims-agent-backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: mmaug-backend-staging-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download only the verified backend JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-jar
          path: release
      - name: Sign in with the staging federated deployment identity
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the Java JAR to the backend App Service
        run: |
          az webapp deploy --resource-group rg_mmaug_insurance \
            --name app-mmaug-api-stg-01 --type jar \
            --src-path release/mmaug-claims-agent-backend-0.0.1-SNAPSHOT.jar \
            --only-show-errors --output none
