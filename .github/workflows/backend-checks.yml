name: Backend checks
on:
  pull_request:
    paths: ['mmaug-claims-agent-backend/**', 'scripts/**', 'tests/evaluation/**', '.github/workflows/backend-checks.yml']
  push:
    branches: [main, develop]
    paths: ['mmaug-claims-agent-backend/**', 'scripts/**', 'tests/evaluation/**', '.github/workflows/backend-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MMAUG_RUN_LIVE_OCR: 'false'
      MMAUG_RUN_LIVE_MODEL: 'false'
    defaults:
      run:
        working-directory: mmaug-claims-agent-backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: mmaug-claims-agent-backend/pom.xml
      - name: Verify with isolated PostgreSQL tests
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Build candidate image without publishing
        run: docker build -t mmaug-backend:ci .
      - name: Smoke test the candidate image with isolated synthetic PostgreSQL
        working-directory: .
        run: bash scripts/test-container-smoke.sh mmaug-backend:ci /tmp/mmaug-container-smoke.json
      - name: Check evaluation scoring without provider calls
        working-directory: .
        run: |
          python3 -m unittest discover -s tests/evaluation -p test_scoring.py
          python3 scripts/evaluate_live_claims.py --output /tmp/mmaug-evaluation-dry-run
      - name: Record candidate JAR checksum
        run: sha256sum target/mmaug-claims-agent-backend-*.jar > target/jar-sha256.txt
      - name: Retain test and container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-verification-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            mmaug-claims-agent-backend/target/surefire-reports/TEST-*.xml
            mmaug-claims-agent-backend/target/jar-sha256.txt
            /tmp/mmaug-container-smoke.json
